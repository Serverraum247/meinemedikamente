appId: com.meinemedikamente
name: Add liquid medication
tags:
  - critical
  - ios
  - android
---
- launchApp:
    clearState: true
- assertVisible: "Keine Medikamente"
- tapOn:
    id: "e2e-add-medication-button"
    retryTapIfNoChange: true
- waitForAnimationToEnd
- assertVisible:
    id: "medication-name-input"
- tapOn: "E2E Flüssigkeit speichern"
- assertVisible: "Gespeichert"
- tapOn: "OK"
- assertVisible: "Paracetamol Saft"
- assertVisible: "✓ 100"
- assertVisible: "ml"
- assertVisible: "20 Tage"
- assertVisible: "bis 29.05.2026"
